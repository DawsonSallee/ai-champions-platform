<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" font-family="Inter, Segoe UI, -apple-system, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbfc"/>
      <stop offset="100%" stop-color="#f1f3f7"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e7eb" stroke-width="0.4" opacity="0.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1400" height="980" fill="url(#bg)"/>
  <rect width="1400" height="980" fill="url(#grid)"/>

  <!-- ─── Title block ─── -->
  <g>
    <text x="60" y="56" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="-0.3">
      AI Champions Platform — Technical Reference Architecture
    </text>
    <text x="60" y="80" font-size="12" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      subscription c7a041a4-… · tenant 9457923f-… · region eastus2 (db: centralus) · iac infra/main.bicep
    </text>
  </g>

  <!-- ─── Section: Identity / Auth flow ─── -->
  <g transform="translate(60, 120)">
    <text x="0" y="0" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1.6">IDENTITY &amp; AUTH FLOW</text>

    <!-- Browser -->
    <g transform="translate(0, 18)">
      <rect width="200" height="76" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#soft)"/>
      <text x="14" y="22" font-size="11" font-weight="700" fill="#0f172a">Browser</text>
      <text x="14" y="40" font-size="10" fill="#64748b" font-family="ui-monospace, monospace">User-Agent</text>
      <text x="14" y="56" font-size="10" fill="#64748b" font-family="ui-monospace, monospace">cookies + fetch</text>
      <text x="14" y="70" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">TLS 1.2+</text>
    </g>

    <!-- Entra -->
    <g transform="translate(280, 18)">
      <rect width="300" height="76" rx="6" fill="#ffffff" stroke="#0078d4" stroke-width="1.4" filter="url(#soft)"/>
      <text x="14" y="22" font-size="11" font-weight="700" fill="#0f172a">Microsoft Entra ID · app registration</text>
      <text x="14" y="40" font-size="10" fill="#475569" font-family="ui-monospace, monospace">app_id 46ed13a4-…</text>
      <text x="14" y="54" font-size="10" fill="#475569" font-family="ui-monospace, monospace">audience AzureADMyOrg</text>
      <text x="14" y="68" font-size="10" fill="#475569" font-family="ui-monospace, monospace">/api/auth/callback/microsoft-entra-id</text>
    </g>

    <!-- Container App auth target -->
    <g transform="translate(600, 18)">
      <rect width="300" height="76" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4" filter="url(#soft)"/>
      <text x="14" y="22" font-size="11" font-weight="700" fill="#0f172a">NextAuth.js (Auth.js v5 beta)</text>
      <text x="14" y="40" font-size="10" fill="#475569" font-family="ui-monospace, monospace">provider: microsoft-entra-id</text>
      <text x="14" y="54" font-size="10" fill="#475569" font-family="ui-monospace, monospace">session: JWT · sets HttpOnly cookie</text>
      <text x="14" y="68" font-size="10" fill="#475569" font-family="ui-monospace, monospace">roles claim → app permissions</text>
    </g>

    <!-- Sequence labels -->
    <g font-size="9" fill="#64748b" font-family="ui-monospace, monospace">
      <text x="208" y="50" font-weight="700" fill="#4f46e5">1</text>
      <text x="214" y="50">GET /</text>
      <text x="208" y="64" font-weight="700" fill="#4f46e5">2</text>
      <text x="214" y="64">302 → /authorize</text>

      <text x="588" y="50" font-weight="700" fill="#4f46e5">3</text>
      <text x="594" y="50">code grant</text>
      <text x="588" y="64" font-weight="700" fill="#4f46e5">4</text>
      <text x="594" y="64">id_token (JWT)</text>
    </g>

    <line x1="200" y1="56" x2="280" y2="56" stroke="#4f46e5" stroke-width="1.2" marker-end="url(#arrowAccent)"/>
    <line x1="580" y1="56" x2="600" y2="56" stroke="#4f46e5" stroke-width="1.2" marker-end="url(#arrowAccent)"/>

    <!-- Federated cred -->
    <g transform="translate(920, 18)">
      <rect width="380" height="76" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.4" filter="url(#soft)"/>
      <text x="14" y="22" font-size="11" font-weight="700" fill="#065f46">Federated credential (OIDC) · CI ⇄ Azure</text>
      <text x="14" y="40" font-size="10" fill="#047857" font-family="ui-monospace, monospace">issuer  token.actions.githubusercontent.com</text>
      <text x="14" y="54" font-size="10" fill="#047857" font-family="ui-monospace, monospace">subject repo:DawsonSallee/ai-champions-platform:ref:refs/heads/main</text>
      <text x="14" y="68" font-size="10" fill="#047857" font-family="ui-monospace, monospace">audience api://AzureADTokenExchange</text>
    </g>
  </g>

  <!-- ─── Section: Azure resource group ─── -->
  <g>
    <rect x="60" y="250" width="1280" height="400" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.7"/>
    <g transform="translate(72, 240)">
      <rect width="370" height="22" rx="4" fill="#0f172a"/>
      <text x="12" y="15" font-size="11" font-weight="700" fill="white" font-family="ui-monospace, monospace">resourceGroups/ai-champions-rg</text>
      <text x="240" y="15" font-size="10" fill="rgba(255,255,255,0.7)" font-family="ui-monospace, monospace">eastus2 + centralus</text>
    </g>
  </g>

  <!-- Container Apps Environment -->
  <g transform="translate(80, 280)">
    <rect width="540" height="170" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#soft)"/>
    <g>
      <rect x="0" y="0" width="540" height="26" rx="6" fill="#eef2ff"/>
      <text x="14" y="18" font-size="11" font-weight="700" fill="#3730a3" font-family="ui-monospace, monospace">Microsoft.App/managedEnvironments · aichamp-dev-env</text>
    </g>

    <!-- Container App -->
    <g transform="translate(16, 40)">
      <rect width="508" height="118" rx="6" fill="#0f172a"/>
      <text x="16" y="22" font-size="10" font-weight="700" fill="rgba(255,255,255,0.7)" letter-spacing="1.4" font-family="ui-monospace, monospace">CONTAINER APP · aichamp-dev-app</text>
      <text x="16" y="44" font-size="13" font-weight="700" fill="#ffffff" font-family="ui-monospace, monospace">ghcr.io/dawsonsallee/ai-champions-platform:&lt;sha&gt;</text>

      <g font-size="10" font-family="ui-monospace, monospace" fill="rgba(255,255,255,0.85)">
        <text x="16" y="68">resources    0.5 vCPU · 1 GiB RAM</text>
        <text x="16" y="82">scale        1-3 replicas (HTTP-traffic rule)</text>
        <text x="16" y="96">ingress      external · targetPort 3000 · transport auto</text>
        <text x="16" y="110">liveness     GET /api/health → 200 (initialDelay 30s)</text>
      </g>

      <g transform="translate(330, 60)" font-size="9" font-family="ui-monospace, monospace" fill="rgba(255,255,255,0.7)">
        <text x="0" y="0">env (from Bicep secrets):</text>
        <text x="0" y="14">  DATABASE_URL</text>
        <text x="0" y="26">  AUTH_SECRET</text>
        <text x="0" y="38">  AUTH_ENTRA_CLIENT_SECRET</text>
        <text x="0" y="50">  APPLICATIONINSIGHTS_CONNECTION_STRING</text>
      </g>
    </g>
  </g>

  <!-- Data tier -->
  <g transform="translate(640, 280)">
    <text x="0" y="-8" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1.6">DATA TIER</text>

    <!-- Postgres -->
    <g transform="translate(0, 0)">
      <rect width="220" height="80" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.4" filter="url(#soft)"/>
      <text x="14" y="20" font-size="11" font-weight="700" fill="#0f172a">PostgreSQL Flexible Server</text>
      <g font-size="9.5" font-family="ui-monospace, monospace" fill="#475569">
        <text x="14" y="36">aichamp-dev-db-cu</text>
        <text x="14" y="50">Postgres 16 · B1ms · 32 GiB</text>
        <text x="14" y="64">tcp/5432 · sslmode=require</text>
        <text x="14" y="76" fill="#64748b">backup 14d · PITR enabled</text>
      </g>
    </g>

    <!-- Blob -->
    <g transform="translate(240, 0)">
      <rect width="220" height="80" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.4" filter="url(#soft)"/>
      <text x="14" y="20" font-size="11" font-weight="700" fill="#0f172a">Blob Storage</text>
      <g font-size="9.5" font-family="ui-monospace, monospace" fill="#475569">
        <text x="14" y="36">aichampdevsa</text>
        <text x="14" y="50">Standard_LRS · TLS 1.2+</text>
        <text x="14" y="64">container: artifacts (private)</text>
        <text x="14" y="76" fill="#64748b">soft-delete 30d (blob + container)</text>
      </g>
    </g>

    <!-- Key Vault -->
    <g transform="translate(480, 0)">
      <rect width="220" height="80" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.4" filter="url(#soft)"/>
      <text x="14" y="20" font-size="11" font-weight="700" fill="#0f172a">Key Vault</text>
      <g font-size="9.5" font-family="ui-monospace, monospace" fill="#475569">
        <text x="14" y="36">aichamp-dev-kv</text>
        <text x="14" y="50">SKU standard · RBAC-auth</text>
        <text x="14" y="64">soft-delete 7d</text>
        <text x="14" y="76" fill="#64748b">DB creds + AUTH_SECRET</text>
      </g>
    </g>

    <!-- Observability -->
    <g transform="translate(0, 100)">
      <rect width="700" height="70" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.4" filter="url(#soft)"/>
      <text x="14" y="20" font-size="11" font-weight="700" fill="#0f172a">Observability</text>
      <g font-size="9.5" font-family="ui-monospace, monospace" fill="#475569">
        <text x="14" y="36">aichamp-dev-law (Microsoft.OperationalInsights/workspaces) · PerGB2018 · 30d retention</text>
        <text x="14" y="50">aichamp-dev-appi (Microsoft.Insights/components) · workspace-backed App Insights</text>
        <text x="14" y="64" fill="#64748b">container stdout/stderr + APPLICATIONINSIGHTS_CONNECTION_STRING → unified workspace</text>
      </g>
    </g>
  </g>

  <!-- Connections from Container App → data -->
  <g stroke="#94a3b8" stroke-width="1" fill="none">
    <path d="M 588 380 L 640 320" marker-end="url(#arrow)"/>
    <path d="M 588 380 L 880 320" marker-end="url(#arrow)"/>
    <path d="M 588 380 L 1120 320" marker-end="url(#arrow)"/>
    <path d="M 588 410 L 640 420" marker-end="url(#arrow)"/>
  </g>

  <g font-size="8.5" fill="#64748b" font-family="ui-monospace, monospace">
    <text x="615" y="348">postgres+ssl</text>
    <text x="800" y="335">REST · Azure SDK</text>
    <text x="1010" y="335">secretRef (env)</text>
    <text x="600" y="430">logs / traces</text>
  </g>

  <!-- ─── Section: CI/CD pipeline ─── -->
  <g transform="translate(60, 700)">
    <text x="0" y="0" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1.6">CI / CD · .github/workflows/deploy.yml</text>

    <g transform="translate(0, 18)">
      <rect width="1280" height="180" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#soft)"/>

      <!-- step boxes laid out in a sequence -->
      <g transform="translate(20, 18)">
        <rect width="150" height="50" rx="4" fill="#0f172a"/>
        <text x="10" y="18" font-size="10" font-weight="700" fill="rgba(255,255,255,0.7)" font-family="ui-monospace, monospace">trigger</text>
        <text x="10" y="36" font-size="11" font-weight="700" fill="white" font-family="ui-monospace, monospace">push → main</text>
      </g>

      <g transform="translate(190, 18)">
        <rect width="200" height="50" rx="4" fill="#1e293b"/>
        <text x="10" y="18" font-size="10" font-weight="700" fill="rgba(255,255,255,0.7)" font-family="ui-monospace, monospace">build</text>
        <text x="10" y="36" font-size="11" font-weight="600" fill="white" font-family="ui-monospace, monospace">docker buildx + cache</text>
      </g>

      <g transform="translate(410, 18)">
        <rect width="180" height="50" rx="4" fill="#1e293b"/>
        <text x="10" y="18" font-size="10" font-weight="700" fill="rgba(255,255,255,0.7)" font-family="ui-monospace, monospace">push</text>
        <text x="10" y="36" font-size="11" font-weight="600" fill="white" font-family="ui-monospace, monospace">ghcr.io :&lt;sha&gt; + :latest</text>
      </g>

      <g transform="translate(610, 18)">
        <rect width="180" height="50" rx="4" fill="#065f46"/>
        <text x="10" y="18" font-size="10" font-weight="700" fill="rgba(255,255,255,0.7)" font-family="ui-monospace, monospace">auth</text>
        <text x="10" y="36" font-size="11" font-weight="600" fill="white" font-family="ui-monospace, monospace">azure/login@v2 (OIDC)</text>
      </g>

      <g transform="translate(810, 18)">
        <rect width="200" height="50" rx="4" fill="#4338ca"/>
        <text x="10" y="18" font-size="10" font-weight="700" fill="rgba(255,255,255,0.7)" font-family="ui-monospace, monospace">deploy</text>
        <text x="10" y="36" font-size="11" font-weight="600" fill="white" font-family="ui-monospace, monospace">arm-deploy infra/main.bicep</text>
      </g>

      <g transform="translate(1030, 18)">
        <rect width="230" height="50" rx="4" fill="#005a9e"/>
        <text x="10" y="18" font-size="10" font-weight="700" fill="rgba(255,255,255,0.7)" font-family="ui-monospace, monospace">revision</text>
        <text x="10" y="36" font-size="11" font-weight="600" fill="white" font-family="ui-monospace, monospace">Container App takes traffic</text>
      </g>

      <!-- arrows between step boxes -->
      <g stroke="#cbd5e1" stroke-width="1.4" fill="none">
        <line x1="170" y1="43" x2="190" y2="43" marker-end="url(#arrow)"/>
        <line x1="390" y1="43" x2="410" y2="43" marker-end="url(#arrow)"/>
        <line x1="590" y1="43" x2="610" y2="43" marker-end="url(#arrow)"/>
        <line x1="790" y1="43" x2="810" y2="43" marker-end="url(#arrow)"/>
        <line x1="1010" y1="43" x2="1030" y2="43" marker-end="url(#arrow)"/>
      </g>

      <!-- post-deploy steps (DB migrations) -->
      <g transform="translate(20, 92)">
        <text x="0" y="0" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1.4" font-family="ui-monospace, monospace">POST-DEPLOY · runs against the live Postgres via firewall-permitted runner IP</text>

        <g font-size="11" font-family="ui-monospace, monospace" fill="#0f172a" transform="translate(0, 18)">
          <text x="0" y="14">$ npm ci</text>
          <text x="0" y="30">$ npm run db:migrate    <tspan fill="#64748b">// drizzle-kit applies pending SQL migrations</tspan></text>
          <text x="0" y="46">$ npm run db:bootstrap  <tspan fill="#64748b">// idempotent seed of reference data (roles, tier matrix, etc.)</tspan></text>
        </g>
      </g>
    </g>
  </g>

  <!-- ─── Footer: stack ─── -->
  <g transform="translate(60, 930)">
    <text x="0" y="0" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">
      stack  next@15  ·  react@18  ·  drizzle-orm  ·  postgres-js  ·  next-auth@5-beta  ·  recharts  ·  tailwind@3  ·  bicep@cli  ·  node@22
    </text>
    <text x="0" y="14" font-size="10" fill="#94a3b8" font-family="ui-monospace, monospace">
      ops    1 resource group  ·  no VNet/private endpoints (dev posture)  ·  Postgres firewall: 0.0.0.0/0  ·  image: public ghcr.io
    </text>
  </g>
</svg>
