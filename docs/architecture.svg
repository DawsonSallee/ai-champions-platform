<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f8"/>
    </linearGradient>
    <linearGradient id="appGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="azureGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#005a9e"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="secretGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="ghGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24292e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0a0a0a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0078d4"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>

  <!-- Title -->
  <text x="700" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#0a0a0a" letter-spacing="-0.5">
    AI Champions Platform — Architecture
  </text>
  <text x="700" y="68" text-anchor="middle" font-size="13" fill="#64748b">
    Next.js on Azure Container Apps · single resource group · OIDC-based CI/CD
  </text>

  <!-- ─────────────  TOP ROW — Users + Entra  ───────────── -->

  <!-- Users -->
  <g transform="translate(80, 105)">
    <rect width="220" height="130" rx="12" fill="white" stroke="#e5e5e5" stroke-width="1" filter="url(#shadow)"/>
    <text x="110" y="28" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">USERS</text>
    <g transform="translate(28, 45)">
      <circle cx="10" cy="12" r="8" fill="#4f46e5"/>
      <text x="28" y="17" font-size="13" fill="#0a0a0a">Champions</text>
    </g>
    <g transform="translate(28, 73)">
      <circle cx="10" cy="12" r="8" fill="#0ea5e9"/>
      <text x="28" y="17" font-size="13" fill="#0a0a0a">Reviewers</text>
    </g>
    <g transform="translate(28, 101)">
      <circle cx="10" cy="12" r="8" fill="#10b981"/>
      <text x="28" y="17" font-size="13" fill="#0a0a0a">AI Team · Admin</text>
    </g>
  </g>

  <!-- Entra ID -->
  <g transform="translate(380, 105)">
    <rect width="220" height="130" rx="12" fill="url(#azureGrad)" filter="url(#shadow)"/>
    <text x="110" y="28" text-anchor="middle" font-size="11" font-weight="600" fill="rgba(255,255,255,0.85)" letter-spacing="0.5">IDENTITY</text>
    <text x="110" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="white">Microsoft Entra ID</text>
    <text x="110" y="84" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.9)">SSO · App roles</text>
    <text x="110" y="104" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.9)">OIDC federation</text>
  </g>

  <!-- Arrow Users → Entra -->
  <line x1="300" y1="170" x2="380" y2="170" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="340" y="160" text-anchor="middle" font-size="11" fill="#64748b">sign in</text>

  <!-- ─────────────  RESOURCE GROUP  ───────────── -->

  <g transform="translate(80, 290)">
    <rect width="1240" height="380" rx="20" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
    <rect x="24" y="-16" width="320" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="40" y="3" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">AZURE RESOURCE GROUP</text>
    <text x="40" y="20" font-size="13" font-weight="700" fill="#0a0a0a">ai-champions-rg</text>
  </g>

  <!-- Container Apps Environment -->
  <g transform="translate(140, 320)">
    <rect width="480" height="160" rx="14" fill="white" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="26" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">CONTAINER APPS ENV · aichamp-dev-env</text>

    <!-- Container App -->
    <g transform="translate(40, 46)">
      <rect width="400" height="98" rx="10" fill="url(#appGrad)" filter="url(#shadow)"/>
      <text x="200" y="28" text-anchor="middle" font-size="11" font-weight="600" fill="rgba(255,255,255,0.85)" letter-spacing="0.5">CONTAINER APP</text>
      <text x="200" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="white">aichamp-dev-app</text>
      <text x="200" y="74" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.9)">Next.js 15 · 0.5 vCPU · 1 GiB · scale 1–3</text>
      <text x="200" y="90" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">/api/health probe · public HTTPS</text>
    </g>
  </g>

  <!-- Observability -->
  <g transform="translate(680, 320)">
    <rect width="280" height="160" rx="14" fill="white" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="26" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">OBSERVABILITY</text>

    <g transform="translate(20, 42)">
      <rect width="240" height="48" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="120" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">App Insights</text>
      <text x="120" y="40" text-anchor="middle" font-size="11" fill="#92400e">traces · errors · metrics</text>
    </g>

    <g transform="translate(20, 100)">
      <rect width="240" height="48" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="120" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Log Analytics</text>
      <text x="120" y="40" text-anchor="middle" font-size="11" fill="#1e40af">container logs · 30d retention</text>
    </g>
  </g>

  <!-- Data services row -->
  <g transform="translate(140, 510)">
    <text x="0" y="0" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">DATA &amp; SECRETS</text>

    <g transform="translate(0, 14)">
      <rect width="170" height="120" rx="12" fill="url(#dataGrad)" filter="url(#shadow)"/>
      <text x="85" y="28" text-anchor="middle" font-size="11" font-weight="600" fill="rgba(255,255,255,0.85)" letter-spacing="0.5">DATABASE</text>
      <text x="85" y="55" text-anchor="middle" font-size="15" font-weight="700" fill="white">Postgres</text>
      <text x="85" y="76" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">Flexible · B1ms</text>
      <text x="85" y="93" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">32 GiB · centralus</text>
      <text x="85" y="110" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.75)">aichamp-dev-db-cu</text>
    </g>

    <g transform="translate(195, 14)">
      <rect width="170" height="120" rx="12" fill="url(#dataGrad)" filter="url(#shadow)"/>
      <text x="85" y="28" text-anchor="middle" font-size="11" font-weight="600" fill="rgba(255,255,255,0.85)" letter-spacing="0.5">FILES</text>
      <text x="85" y="55" text-anchor="middle" font-size="15" font-weight="700" fill="white">Blob Storage</text>
      <text x="85" y="76" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">Standard LRS</text>
      <text x="85" y="93" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">soft-delete 30d</text>
      <text x="85" y="110" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.75)">aichampdevsa</text>
    </g>

    <g transform="translate(390, 14)">
      <rect width="170" height="120" rx="12" fill="url(#secretGrad)" filter="url(#shadow)"/>
      <text x="85" y="28" text-anchor="middle" font-size="11" font-weight="600" fill="rgba(255,255,255,0.85)" letter-spacing="0.5">SECRETS</text>
      <text x="85" y="55" text-anchor="middle" font-size="15" font-weight="700" fill="white">Key Vault</text>
      <text x="85" y="76" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.9)">RBAC-auth</text>
      <text x="85" y="93" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.85)">soft-delete 7d</text>
      <text x="85" y="110" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.75)">aichamp-dev-kv</text>
    </g>
  </g>

  <!-- ─────────────  ARROWS — User → App, Entra → App, App → Data, App → Observability  ───────────── -->

  <!-- Users → ContainerApp (HTTPS, around the boundary) -->
  <path d="M 190 235 Q 190 280 340 410" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="290" font-size="11" fill="#4f46e5">HTTPS</text>

  <!-- Entra → ContainerApp (ID token) -->
  <path d="M 490 235 L 490 365" fill="none" stroke="#0078d4" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="500" y="290" font-size="11" fill="#0078d4">ID token</text>

  <!-- Container App → Postgres -->
  <line x1="225" y1="480" x2="225" y2="522" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Container App → Blob -->
  <line x1="420" y1="480" x2="420" y2="522" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Container App → KV -->
  <line x1="615" y1="480" x2="615" y2="522" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Container App → Observability -->
  <path d="M 620 410 L 680 410" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="630" y="402" font-size="11" fill="#64748b">logs</text>

  <!-- ─────────────  CI / CD strip  ───────────── -->

  <g transform="translate(80, 705)">
    <rect width="1240" height="90" rx="14" fill="url(#ghGrad)" filter="url(#shadow)"/>
    <text x="22" y="26" font-size="11" font-weight="600" fill="rgba(255,255,255,0.7)" letter-spacing="0.5">CI / CD · GitHub Actions</text>

    <g transform="translate(22, 40)">
      <circle cx="20" cy="20" r="18" fill="white"/>
      <path d="M 20 8 a 12 12 0 0 0 -3.8 23.4 c 0.6 0.1 0.8 -0.3 0.8 -0.6 v -2.1 c -3.4 0.7 -4.1 -1.6 -4.1 -1.6 c -0.6 -1.4 -1.4 -1.8 -1.4 -1.8 c -1.1 -0.8 0.1 -0.8 0.1 -0.8 c 1.2 0.1 1.9 1.3 1.9 1.3 c 1.1 1.9 2.9 1.4 3.7 1 c 0.1 -0.8 0.4 -1.4 0.8 -1.7 c -2.7 -0.3 -5.6 -1.4 -5.6 -6 c 0 -1.3 0.5 -2.4 1.3 -3.3 c -0.1 -0.3 -0.6 -1.6 0.1 -3.3 c 0 0 1.1 -0.3 3.5 1.3 c 1 -0.3 2.1 -0.4 3.2 -0.4 c 1.1 0 2.2 0.1 3.2 0.4 c 2.4 -1.6 3.5 -1.3 3.5 -1.3 c 0.7 1.8 0.3 3.1 0.1 3.4 c 0.8 0.9 1.3 2 1.3 3.3 c 0 4.7 -2.9 5.7 -5.6 6 c 0.4 0.4 0.8 1.1 0.8 2.3 v 3.4 c 0 0.3 0.2 0.7 0.8 0.6 A 12 12 0 0 0 20 8 z" fill="#0d1117"/>
      <text x="50" y="18" font-size="13" font-weight="700" fill="white">GitHub Actions</text>
      <text x="50" y="34" font-size="11" fill="rgba(255,255,255,0.75)">build · push · migrate · deploy</text>
    </g>

    <!-- Step 1: push to ghcr.io -->
    <line x1="270" y1="60" x2="320" y2="60" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g transform="translate(330, 42)">
      <rect width="120" height="36" rx="6" fill="#374151"/>
      <text x="60" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="white">ghcr.io</text>
    </g>

    <!-- Step 2: OIDC to Azure -->
    <line x1="460" y1="60" x2="510" y2="60" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g transform="translate(520, 42)">
      <rect width="180" height="36" rx="6" fill="#10b981"/>
      <text x="90" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="white">OIDC token → Azure</text>
    </g>

    <!-- Step 3: deploy -->
    <line x1="710" y1="60" x2="760" y2="60" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g transform="translate(770, 42)">
      <rect width="180" height="36" rx="6" fill="#4f46e5"/>
      <text x="90" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="white">Bicep apply + migrate</text>
    </g>

    <!-- Step 4: pull image -->
    <line x1="960" y1="60" x2="1010" y2="60" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g transform="translate(1020, 42)">
      <rect width="200" height="36" rx="6" fill="#0078d4"/>
      <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="white">Container App new revision</text>
    </g>
  </g>

  <!-- CI deploy → Container App arrow -->
  <path d="M 1110 705 Q 1110 600 1000 480" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>
  <text x="1115" y="600" font-size="11" fill="#059669">deploy</text>

  <!-- Footer -->
  <text x="700" y="805" text-anchor="middle" font-size="10" fill="#94a3b8">
    Bicep is the source of truth (infra/main.bicep) · Drizzle ORM · NextAuth with Microsoft Entra ID provider
  </text>
</svg>
