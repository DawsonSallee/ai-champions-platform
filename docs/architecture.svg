<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Inter, Segoe UI, -apple-system, system-ui, sans-serif">
  <defs>
    <!-- Subtle background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfcfe"/>
      <stop offset="100%" stop-color="#f3f5f9"/>
    </linearGradient>

    <!-- Azure boundary tint -->
    <linearGradient id="azureBoundary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf3fb"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>

    <!-- Service tile -->
    <linearGradient id="tileLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafbfd"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowDeploy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>

    <!-- Drop shadow -->
    <filter id="card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0a0a0a" flood-opacity="0.06"/>
    </filter>
    <filter id="hero" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4f46e5" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>

  <!-- ─── Title ─── -->
  <text x="700" y="60" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a" letter-spacing="-0.4">
    AI Champions Platform
  </text>
  <text x="700" y="84" text-anchor="middle" font-size="12" fill="#64748b" letter-spacing="0.2">
    Next.js on Azure Container Apps · single resource group · CI/CD via GitHub Actions
  </text>

  <!-- ─── Top row: User + Entra ─── -->

  <!-- User -->
  <g transform="translate(360, 130)">
    <rect width="280" height="110" rx="12" fill="url(#tileLight)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#card)"/>
    <text x="140" y="32" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="1.4">USER</text>
    <text x="140" y="60" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Browser</text>
    <text x="140" y="84" text-anchor="middle" font-size="12" fill="#475569">Champions · Reviewers · AI Team</text>
  </g>

  <!-- Entra -->
  <g transform="translate(760, 130)">
    <rect width="280" height="110" rx="12" fill="url(#tileLight)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#card)"/>
    <text x="140" y="32" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="1.4">IDENTITY</text>
    <text x="140" y="60" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Microsoft Entra ID</text>
    <text x="140" y="84" text-anchor="middle" font-size="12" fill="#475569">SSO · App roles</text>
  </g>

  <!-- User ⇄ Entra (sign-in) -->
  <line x1="640" y1="185" x2="760" y2="185" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="700" y="178" text-anchor="middle" font-size="11" fill="#64748b">sign in · ID token</text>

  <!-- User → App (HTTPS) -->
  <path d="M 500 240 L 500 330" fill="none" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="510" y="290" font-size="11" fill="#4f46e5" font-weight="600">HTTPS</text>

  <!-- ─── Azure boundary ─── -->
  <g>
    <rect x="100" y="310" width="1200" height="430" rx="20" fill="url(#azureBoundary)" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.7"/>
    <g transform="translate(126, 295)">
      <rect width="220" height="32" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <circle cx="22" cy="16" r="6" fill="#0078d4"/>
      <text x="38" y="20" font-size="12" font-weight="700" fill="#0f172a">Azure</text>
      <text x="80" y="20" font-size="11" fill="#64748b">resource group · ai-champions-rg</text>
    </g>
  </g>

  <!-- ─── Container App (hero) ─── -->
  <g transform="translate(400, 350)">
    <rect width="600" height="130" rx="14" fill="#4f46e5" filter="url(#hero)"/>
    <text x="300" y="38" text-anchor="middle" font-size="10" font-weight="600" fill="rgba(255,255,255,0.7)" letter-spacing="1.4">CONTAINER APP</text>
    <text x="300" y="72" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Next.js web app</text>
    <text x="300" y="100" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.85)">0.5 vCPU · 1 GiB · scale 1–3 · /api/health</text>
  </g>

  <!-- Container App → Data layer connectors -->
  <line x1="500" y1="480" x2="240" y2="570" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="600" y1="480" x2="500" y2="570" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="700" y1="480" x2="760" y2="570" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="900" y1="480" x2="1020" y2="570" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ─── Service tiles row ─── -->

  <!-- Postgres -->
  <g transform="translate(150, 580)">
    <rect width="200" height="120" rx="12" fill="url(#tileLight)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#card)"/>
    <rect x="0" y="0" width="200" height="4" rx="2" fill="#0ea5e9"/>
    <text x="100" y="36" text-anchor="middle" font-size="10" font-weight="600" fill="#0ea5e9" letter-spacing="1.4">DATABASE</text>
    <text x="100" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Postgres</text>
    <text x="100" y="84" text-anchor="middle" font-size="11" fill="#475569">Flexible Server · B1ms</text>
    <text x="100" y="102" text-anchor="middle" font-size="11" fill="#64748b">32 GiB · centralus</text>
  </g>

  <!-- Blob -->
  <g transform="translate(400, 580)">
    <rect width="200" height="120" rx="12" fill="url(#tileLight)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#card)"/>
    <rect x="0" y="0" width="200" height="4" rx="2" fill="#0ea5e9"/>
    <text x="100" y="36" text-anchor="middle" font-size="10" font-weight="600" fill="#0ea5e9" letter-spacing="1.4">FILES</text>
    <text x="100" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Blob Storage</text>
    <text x="100" y="84" text-anchor="middle" font-size="11" fill="#475569">Standard LRS</text>
    <text x="100" y="102" text-anchor="middle" font-size="11" fill="#64748b">soft-delete 30 days</text>
  </g>

  <!-- Key Vault -->
  <g transform="translate(650, 580)">
    <rect width="200" height="120" rx="12" fill="url(#tileLight)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#card)"/>
    <rect x="0" y="0" width="200" height="4" rx="2" fill="#10b981"/>
    <text x="100" y="36" text-anchor="middle" font-size="10" font-weight="600" fill="#10b981" letter-spacing="1.4">SECRETS</text>
    <text x="100" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Key Vault</text>
    <text x="100" y="84" text-anchor="middle" font-size="11" fill="#475569">RBAC-auth</text>
    <text x="100" y="102" text-anchor="middle" font-size="11" fill="#64748b">soft-delete 7 days</text>
  </g>

  <!-- Observability (combined) -->
  <g transform="translate(900, 580)">
    <rect width="350" height="120" rx="12" fill="url(#tileLight)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#card)"/>
    <rect x="0" y="0" width="350" height="4" rx="2" fill="#f59e0b"/>
    <text x="175" y="36" text-anchor="middle" font-size="10" font-weight="600" fill="#d97706" letter-spacing="1.4">OBSERVABILITY</text>
    <text x="175" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">App Insights + Log Analytics</text>
    <text x="175" y="84" text-anchor="middle" font-size="11" fill="#475569">traces · errors · container logs</text>
    <text x="175" y="102" text-anchor="middle" font-size="11" fill="#64748b">30-day retention</text>
  </g>

  <!-- ─── Deploy lane ─── -->
  <g transform="translate(100, 790)">
    <rect width="1200" height="76" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#card)"/>

    <!-- label -->
    <text x="28" y="32" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="1.4">DEPLOY</text>
    <text x="28" y="56" font-size="13" font-weight="700" fill="#0f172a">git push → main</text>

    <!-- pipeline -->
    <g transform="translate(220, 40)">
      <rect width="150" height="22" rx="6" fill="#0f172a"/>
      <text x="75" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="white">GitHub Actions</text>
    </g>
    <line x1="378" y1="51" x2="408" y2="51" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrowDeploy)"/>
    <g transform="translate(412, 40)">
      <rect width="110" height="22" rx="6" fill="#334155"/>
      <text x="55" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="white">ghcr.io image</text>
    </g>
    <line x1="530" y1="51" x2="560" y2="51" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrowDeploy)"/>
    <g transform="translate(564, 40)">
      <rect width="170" height="22" rx="6" fill="#10b981"/>
      <text x="85" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="white">OIDC federation</text>
    </g>
    <line x1="742" y1="51" x2="772" y2="51" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrowDeploy)"/>
    <g transform="translate(776, 40)">
      <rect width="170" height="22" rx="6" fill="#4f46e5"/>
      <text x="85" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="white">Bicep + migrations</text>
    </g>
    <line x1="954" y1="51" x2="984" y2="51" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#arrowDeploy)"/>
    <g transform="translate(988, 40)">
      <rect width="180" height="22" rx="6" fill="#0078d4"/>
      <text x="90" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="white">new Container App revision</text>
    </g>
  </g>
</svg>
