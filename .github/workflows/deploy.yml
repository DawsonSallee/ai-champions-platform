name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC federation to Azure — no long-lived secret
  contents: read
  packages: write   # push image to ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dawsonsallee/ai-champions-platform

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ─── Build & push image to GitHub Container Registry ──────────────
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make the package public (so Container Apps can pull anonymously)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the user's package and set visibility=public.
          PKG_NAME=$(echo "${{ github.repository }}" | cut -d/ -f2)
          gh api -X PATCH "/user/packages/container/${PKG_NAME}" \
            -f visibility=public 2>&1 || \
            echo "Package may already be public or not yet visible — continuing."

      # ─── Deploy via Bicep ─────────────────────────────────────────────
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            environmentName=dev
            dbLocation=centralus
            entraClientId=${{ secrets.AZURE_CLIENT_ID }}
            entraClientSecret=${{ secrets.ENTRA_CLIENT_SECRET }}
            dbAdminPassword=${{ secrets.DB_PASSWORD }}
            authSecret=${{ secrets.AUTH_SECRET }}
            containerImage=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          failOnStdErr: false

      - name: Bootstrap reference data (idempotent)
        run: |
          DB_FQDN=$(az postgres flexible-server show -g ${{ secrets.AZURE_RESOURCE_GROUP }} -n aichamp-dev-db-cu --query fullyQualifiedDomainName -o tsv)
          export DATABASE_URL="postgres://pgadmin:${{ secrets.DB_PASSWORD }}@${DB_FQDN}:5432/ai_champions?sslmode=require"
          npm ci
          npm run db:migrate
          npm run db:bootstrap

      - name: Print app URL
        run: |
          FQDN=$(az containerapp show -g ${{ secrets.AZURE_RESOURCE_GROUP }} -n aichamp-dev-app --query properties.configuration.ingress.fqdn -o tsv)
          echo "::notice::App URL: https://${FQDN}"
          echo "App URL: https://${FQDN}" >> $GITHUB_STEP_SUMMARY
